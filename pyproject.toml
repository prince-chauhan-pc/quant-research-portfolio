[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-portfolio"
version = "1.0.0"
description = "Tested Python implementations of options, volatility, cointegration and backtest-validation methods"
authors = [{ name = "Prince Chauhan", email = "pchauhanrajput.pc@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "reportlab>=3.6.0"
]
